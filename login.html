<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to ChaloChale to access your bookings and manage your travel plans.">
    <title>Login - ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="sticky-top bg-white shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                    <i class="fas fa-plane-departure text-primary me-2"></i>
                    <span class="text-primary">Chalo</span><span class="text-dark">Chale</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link text-dark" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="destinations.html">Destinations</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="Packages.html">Tour Packages</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="About.html">About</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="contact.html">Contact</a></li>
                    </ul>
                    <a class="btn btn-primary rounded-pill px-4 fw-semibold" href="login.html">Plan Your Trip</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5 bg-light" style="min-height: calc(100vh - 112px);">
        <div class="container d-flex align-items-center justify-content-center" style="min-height: 100%;">
            <div class="card rounded-4 shadow-lg w-100" style="max-width: 520px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold">Welcome Back</h1>
                        <p class="text-muted mb-0">Log in to manage bookings, save trips, and access exclusive offers.</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="loginEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="text-primary text-decoration-none">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Log In</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-0">New to ChaloChale? <a href="signup.html" class="text-primary text-decoration-none">Sign up to get started</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white text-center py-4">
        <p class="mb-0 text-muted">© 2024 ChaloChale. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
</body>
</html>
